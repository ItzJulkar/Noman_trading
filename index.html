<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Noman_trading — Gold Market Analytics</title>
<meta name="description" content="Live gold price, cycle timeline, 70 charts and 20 scored signals for XAU/USD — built on COMEX futures, LBMA and FRED data.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  (function () {
    try {
      var t = localStorage.getItem('nt.theme');
      t = t ? JSON.parse(t) : 'light';
      if (t !== 'light' && t !== 'dark') t = 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
    } catch (e) { }
  })();
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn drawer-btn" id="drawerBtn" title="Charts menu" aria-label="Open the chart menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#/dashboard">
    <span class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linejoin="round">
        <path d="M12 2.5l8 4.2v10.6L12 21.5 4 17.3V6.7z" opacity=".55"/>
        <path d="M12 7l4 2.1v5.3L12 16.5l-4-2.1V9.1z"/>
      </svg>
    </span>
    <span class="brand-text">
      <span class="brand-name">Noman_trading</span>
      <span class="brand-sub">Gold analytics</span>
    </span>
  </a>
  <nav class="topnav" id="topnav"></nav>
  <div class="topbar-right">
    <span class="chip" id="liveChip" title="Live feed">
      <span class="live-dot pulse" id="liveDot"></span><span id="liveChipText" class="mono">connecting…</span>
    </span>
    <button class="icon-btn" id="themeBtn" title="Toggle light / dark theme" aria-label="Toggle theme"></button>
    <a class="btn btn-ghost hide-sm" href="#/about">About</a>
    <button class="btn btn-secondary btn-bell" id="alertsBtn" title="Alerts" aria-label="Alerts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 9a6 6 0 1112 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6z"/><path d="M10 19a2 2 0 004 0"/></svg>
      <span class="badge-count" id="alertBadge" style="display:none"></span>
    </button>
  </div>
</header>

<div class="shell">
  <aside class="sidebar">
    <div class="search-wrap">
      <label class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" placeholder="Search charts (press /)" autocomplete="off" aria-label="Search charts">
      </label>
    </div>
    <div class="side-scroll scroll" id="sidebar"></div>
  </aside>
  <main class="main">
    <div class="main-scroll scroll" id="view"></div>
  </main>
</div>

<div class="toasts" id="toasts"></div>

<script src="js/vendor/highstock.js"></script>
<script src="js/vendor/highcharts-more.js"></script>
<script src="js/vendor/heatmap.js"></script>
<script src="js/vendor/exporting.js"></script>
<script src="js/vendor/offline-exporting.js"></script>
<script src="js/data/nt-data.js"></script>
<script src="js/catalogue.js"></script>
<script src="js/charts.js"></script>
<script src="js/events.js"></script>
<script src="js/live.js"></script>
<script src="js/app.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
